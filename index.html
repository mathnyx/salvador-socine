<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Salvador – Socine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <script>/* aplica o tema salvo antes de pintar, para não piscar */
    try { var t = localStorage.getItem('viagem.tema'); if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
      var e = parseFloat(localStorage.getItem('viagem.texto')); if (e >= 0.85 && e <= 1.5) document.documentElement.style.setProperty('--escala', e); } catch (e) {}
  </script>
  <style>
/* ============================================================
   TOKENS — para trocar o visual, mexa só aqui (e nas fontes).
   Direção A, "Programa impresso" (escolhida por MC em 31/10/2026):
   papel creme, Fraunces nos títulos, filetes e pontilhado, acento dendê.
   ============================================================ */
:root {
  /* cor */
  --cor-fundo: #f2ead8;          /* papel */
  --cor-superficie: #f7f1e3;
  --cor-superficie-2: #e9dfc8;   /* papel-2 */
  --cor-tinta: #1d1b16;
  --cor-tinta-2: #6a6252;
  --cor-linha: #1d1b16;          /* filete em tinta */
  --cor-linha-fraca: #b9ad93;
  --cor-grao: rgba(60, 40, 10, .045);
  /* Paleta de MC (Ateliê, 31/10/2026): papel #F2EAD8, tinta #1D1B16, vinho vivo #C74327,
     lima #6C7F3E, marrom #A5641D. Os hex de MC são os "-forte": entram em elemento gráfico
     e texto grande (passam 3:1, não 4,5:1). Os tokens de texto são o mesmo matiz e croma
     com a luz OKLCH baixada até >= 4,6:1 sobre papel, superfície e papel-2 (contraste.py). */
  --cor-destaque-forte: #C74327; /* vinho vivo */
  --cor-ok-forte: #6C7F3E;       /* lima */
  --cor-aviso-forte: #A5641D;    /* marrom */
  --cor-destaque: #B53125;       /* vinho vivo, versão texto: 5,11:1 no papel */
  --cor-destaque-tinta: #f7f1e3;
  --cor-destaque-suave: #E9C9B5;
  --cor-ok: #566830;             /* lima, versão texto: 5,13:1 */
  --cor-ok-suave: #D7D5B9;
  --cor-aviso: #92521C;          /* marrom, versão texto: 5,09:1 */
  --cor-aviso-suave: #E3CFB3;
  --cor-erro: #B53125;
  --cor-erro-suave: #E9C9B5;
  --cor-veg: #566830;
  --cor-conflito: #B53125;

  /* tipografia */
  --fonte-corpo: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fonte-titulo: "Fraunces", Georgia, "Times New Roman", serif;
  --fonte-dados: "Fraunces", Georgia, serif;
  --peso-titulo: 600;
  --escala: 1;                  /* tamanho do texto, A− / A+ no topo (viagem.texto) */
  --escala-ui: min(var(--escala), 1.15); /* abas e botões do topo crescem pouco, para caber */
  --tam-base: calc(16px * var(--escala));
  --tam-peq: calc(13.5px * var(--escala));
  --tam-micro: calc(12px * var(--escala));
  --tam-h1: calc(26px * var(--escala));
  --tam-h2: calc(22px * var(--escala));
  --tam-h3: calc(19px * var(--escala));

  /* forma e espaço */
  --raio: 0px;
  --raio-peq: 0px;
  --raio-pilula: 0px;
  --borda: 1px solid var(--cor-linha);
  --borda-pontilhada: 1px dotted var(--cor-tinta-2);
  --sombra: none;
  --sombra-alta: 0 10px 30px rgba(40, 28, 8, .25);
  --esp: 16px;
  --esp-peq: 8px;
  --largura-max: 760px;
  --altura-abas: 58px;
}

/* escuro: segue o celular (automático) ou o botão do topo (data-tema) */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    /* tema escuro com a MESMA paleta de MC: fundo na tinta, texto no papel.
       Os hex de MC (-forte) passam 3:1 no fundo escuro; o texto pequeno sobe a luz
       OKLCH (mesmo matiz e croma) até >= 4,6:1 sobre fundo, superfície e superfície-2. */
    --cor-fundo: #1D1B16;
    --cor-superficie: #282520;
    --cor-superficie-2: #323029;
    --cor-tinta: #F2EAD8;
    --cor-tinta-2: #A19B8E;
    --cor-linha: #7D786D;
    --cor-linha-fraca: #434039;
    --cor-grao: rgba(242, 234, 216, .035);
    --cor-destaque: #F66F5C;
    --cor-destaque-tinta: #1D1B16;
    --cor-destaque-suave: #42241A;
    --cor-ok: #8CA065;
    --cor-ok-suave: #2E311F;
    --cor-aviso: #CE8A55;
    --cor-aviso-suave: #3B2B18;
    --cor-erro: #F66F5C;
    --cor-erro-suave: #42241A;
    --cor-veg: #8CA065;
    --cor-conflito: #F66F5C;
    color-scheme: dark;
  }
}
:root[data-tema="escuro"] {
  /* tema escuro com a MESMA paleta de MC: fundo na tinta, texto no papel.
     Os hex de MC (-forte) passam 3:1 no fundo escuro; o texto pequeno sobe a luz
     OKLCH (mesmo matiz e croma) até >= 4,6:1 sobre fundo, superfície e superfície-2. */
  --cor-fundo: #1D1B16;
  --cor-superficie: #282520;
  --cor-superficie-2: #323029;
  --cor-tinta: #F2EAD8;
  --cor-tinta-2: #A19B8E;
  --cor-linha: #7D786D;
  --cor-linha-fraca: #434039;
  --cor-grao: rgba(242, 234, 216, .035);
  --cor-destaque: #F66F5C;
  --cor-destaque-tinta: #1D1B16;
  --cor-destaque-suave: #42241A;
  --cor-ok: #8CA065;
  --cor-ok-suave: #2E311F;
  --cor-aviso: #CE8A55;
  --cor-aviso-suave: #3B2B18;
  --cor-erro: #F66F5C;
  --cor-erro-suave: #42241A;
  --cor-veg: #8CA065;
  --cor-conflito: #F66F5C;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--cor-fundo); color: var(--cor-tinta);
  font: var(--tam-base)/1.45 var(--fonte-corpo);
  padding-bottom: calc(var(--altura-abas) + env(safe-area-inset-bottom, 0px) + 12px);
}
body.trava { overflow: hidden; }
h1, h2, h3 { font-family: var(--fonte-titulo); font-weight: var(--peso-titulo); margin: 0; line-height: 1.2; }
h1 { font-size: var(--tam-h1); }
h2 { font-size: var(--tam-h2); }
h3 { font-size: var(--tam-h3); }
p { margin: 0; }
a { color: var(--cor-destaque); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.oculto { display: none !important; }
.mudo { color: var(--cor-tinta-2); }
.peq { font-size: var(--tam-peq); }
.micro { font-size: var(--tam-micro); }

/* ---------- topo e abas ---------- */
.topo {
  position: sticky; top: 0; z-index: 20; background: var(--cor-fundo);
  border-bottom: var(--borda); padding: 10px var(--esp);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.topo-in { max-width: var(--largura-max); margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topo .sub { font-size: var(--tam-micro); color: var(--cor-tinta-2); }
.topo-acoes { display: flex; gap: 6px; align-items: center; }

.abas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--cor-superficie); border-top: var(--borda);
  display: flex; padding-bottom: env(safe-area-inset-bottom, 0px);
}
.abas button {
  flex: 1; border: 0; background: none; padding: 0; height: var(--altura-abas);
  font-size: var(--tam-peq); color: var(--cor-tinta-2); position: relative;
}
.abas button[aria-current="page"] { color: var(--cor-destaque); font-weight: 650; }
.abas button[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px;
  background: var(--cor-destaque); border-radius: 0 0 3px 3px;
}

main { max-width: var(--largura-max); margin: 0 auto; padding: var(--esp); }
.vista > * + * { margin-top: 14px; }

/* ---------- controles ---------- */
.chip, .btn {
  border: var(--borda); background: var(--cor-superficie); border-radius: var(--raio-pilula);
  padding: 0 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--tam-peq); white-space: nowrap;
}
a.chip { text-decoration: none; color: inherit; }
.chip[aria-pressed="true"], .chip.ativo { background: var(--cor-destaque); border-color: var(--cor-destaque); color: var(--cor-destaque-tinta); }
.btn { border-radius: var(--raio-peq); font-size: var(--tam-base); min-height: 44px; justify-content: center; }
.btn.primario { background: var(--cor-destaque); border-color: var(--cor-destaque); color: var(--cor-destaque-tinta); font-weight: 600; }
.btn.perigo { color: var(--cor-erro); }
.btn.pequeno { min-height: 34px; padding: 0 10px; font-size: var(--tam-peq); }
.btn[disabled], .chip[disabled] { opacity: .5; cursor: default; }
.fila { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rolagem-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.fila.rolagem { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 calc(var(--esp) * -1); padding-left: var(--esp); padding-right: var(--esp); scrollbar-width: none; }
.fila.rolagem::-webkit-scrollbar { display: none; }

.campo { display: grid; gap: 4px; }
.campo > span { font-size: var(--tam-peq); color: var(--cor-tinta-2); }
input[type="text"], input[type="number"], input[type="date"], input[type="password"], input[type="url"], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border: var(--borda); border-radius: var(--raio-peq);
  background: var(--cor-superficie); font-size: max(16px, calc(16px * var(--escala)));
}
textarea { min-height: 80px; resize: vertical; }
.form { display: grid; gap: 12px; }
.erro-form { color: var(--cor-erro); background: var(--cor-erro-suave); padding: 8px 12px; border-radius: var(--raio-peq); font-size: var(--tam-peq); }

/* ---------- cartões ---------- */
.cartao {
  background: var(--cor-superficie); border: var(--borda); border-radius: var(--raio);
  padding: 14px; box-shadow: var(--sombra); display: grid; gap: 10px;
}
.cartao.destaque { outline: 2px solid var(--cor-destaque); }
.cartao-topo { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.meta { font-size: var(--tam-peq); color: var(--cor-tinta-2); }
.faixa { font-family: var(--fonte-dados); font-weight: 700; color: var(--cor-destaque); white-space: nowrap; }
.selo {
  display: inline-block; font-size: var(--tam-micro); padding: 1px 8px; border-radius: var(--raio-pilula);
  background: var(--cor-superficie-2); color: var(--cor-tinta-2); vertical-align: 1px;
}
.selo.veg { background: var(--cor-ok-suave); color: var(--cor-veg); }
.selo.ok { background: var(--cor-ok-suave); color: var(--cor-ok); }
.selo.aviso { background: var(--cor-aviso-suave); color: var(--cor-aviso); }
.selo.erro { background: var(--cor-erro-suave); color: var(--cor-erro); }
.aviso-linha { background: var(--cor-aviso-suave); color: var(--cor-aviso); padding: 8px 12px; border-radius: var(--raio); margin: 8px 0; }
.fatos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; margin: 0; }
.fatos div { display: grid; }
.fatos dt { font-size: var(--tam-micro); color: var(--cor-tinta-2); }
.fatos dd { margin: 0; font-size: var(--tam-peq); }
.alternativa { background: var(--cor-aviso-suave); border-radius: var(--raio-peq); padding: 8px 10px; font-size: var(--tam-peq); }
.alternativa button { border: 0; background: none; padding: 0; color: var(--cor-destaque); text-decoration: underline; font-weight: 600; }
.proveniencia { font-size: var(--tam-micro); color: var(--cor-tinta-2); border-top: var(--borda); padding-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.pratos { border-top: var(--borda); padding-top: 8px; display: grid; gap: 4px; font-size: var(--tam-peq); }
.pratos .linha { display: flex; justify-content: space-between; gap: 10px; }
.preco { font-variant-numeric: tabular-nums; white-space: nowrap; }
.vazio { text-align: center; padding: 28px 16px; border: 1px dashed var(--cor-linha); border-radius: var(--raio); color: var(--cor-tinta-2); display: grid; gap: 12px; justify-items: center; }
.txt-corrido { white-space: pre-line; }

/* ---------- agenda ---------- */
.dia { display: grid; gap: 8px; scroll-margin-top: 70px; }
.dia-titulo { display: flex; align-items: baseline; gap: 8px; }
.dia-titulo h2 { font-size: var(--tam-h3); text-transform: capitalize; }
.dia.hoje .dia-titulo h2::after { content: " · hoje"; color: var(--cor-destaque); font-weight: 600; text-transform: none; }
.sessao { background: var(--cor-superficie); border: var(--borda); border-left: 4px solid var(--cor-destaque); border-radius: var(--raio-peq); padding: 10px 12px; display: grid; gap: 2px; box-shadow: var(--sombra); }
.sessao.todos { border-left-color: var(--cor-aviso); }
.sessao.colega { border-left-color: var(--cor-linha); background: transparent; box-shadow: none; }
.sessao .hora { font-family: var(--fonte-dados); font-size: var(--tam-peq); color: var(--cor-tinta-2); }
.sessao .titulo { font-weight: 600; }
.sessao .conflito { color: var(--cor-conflito); font-size: var(--tam-micro); font-weight: 600; }
.sessao-acoes { margin-top: 6px; gap: 6px; }
.clima { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); border: var(--borda); background: var(--cor-superficie); }
.clima-dia { display: grid; gap: 2px; padding: 8px 10px; border-right: var(--borda-pontilhada); border-bottom: var(--borda-pontilhada); }
.clima-rot { font-size: var(--tam-micro); color: var(--cor-tinta-2); text-transform: capitalize; }
.clima-temp { font-family: var(--fonte-dados); font-size: var(--tam-h3); font-weight: 600; }
.clima-temp small { font-size: var(--tam-peq); color: var(--cor-tinta-2); font-weight: 400; }
.brechas { font-size: var(--tam-peq); color: var(--cor-tinta-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.brecha { border: 1px dashed var(--cor-linha); border-radius: var(--raio-pilula); padding: 2px 10px; }
details.colegas { font-size: var(--tam-peq); }
details.colegas summary { cursor: pointer; color: var(--cor-tinta-2); padding: 4px 0; }
details.colegas .sessao { margin-top: 6px; }

.grade-caixa { border: var(--borda); border-radius: var(--raio); background: var(--cor-superficie); overflow: hidden; }
table.grade { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 100%; }
table.grade th, table.grade td { padding: 8px 10px; border-bottom: var(--borda); border-right: var(--borda); text-align: left; vertical-align: top; font-size: var(--tam-peq); min-width: 118px; }
table.grade thead th { background: var(--cor-superficie-2); font-family: var(--fonte-dados); font-size: var(--tam-micro); position: sticky; top: 0; }
table.grade th.rotulo-linha { position: sticky; left: 0; background: var(--cor-superficie); min-width: 82px; max-width: 96px; z-index: 1; font-weight: 600; }
table.grade thead th.rotulo-linha { background: var(--cor-superficie-2); z-index: 2; }
table.grade tr:last-child th, table.grade tr:last-child td { border-bottom: 0; }
table.grade td.ocupado { background: var(--cor-destaque-suave); }
table.grade td.livre { color: var(--cor-tinta-2); }
table.grade td .sala { font-weight: 600; display: block; }
table.grade td .tit { display: block; color: var(--cor-tinta-2); font-size: var(--tam-micro); margin-top: 2px; }
.contagem { display: inline-block; margin-left: 4px; background: var(--cor-aviso); color: #fff; border-radius: var(--raio-pilula); padding: 0 6px; font-family: var(--fonte-corpo); }

/* ---------- comparação ---------- */
.barra-comparar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--altura-abas) + env(safe-area-inset-bottom, 0px)); z-index: 25;
  background: var(--cor-superficie); border-top: var(--borda); padding: 8px var(--esp);
  display: flex; gap: 8px; align-items: center; justify-content: space-between; box-shadow: var(--sombra-alta);
}
table.comp { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
table.comp th, table.comp td { padding: 8px 10px; border-bottom: var(--borda); border-right: var(--borda); font-size: var(--tam-peq); text-align: left; vertical-align: top; min-width: 138px; max-width: 220px; }
table.comp th.rotulo-linha { position: sticky; left: 0; background: var(--cor-superficie-2); min-width: 84px; max-width: 96px; z-index: 1; font-weight: 600; }
table.comp thead th { background: var(--cor-superficie-2); font-weight: 650; }
table.comp tr.secao th { background: var(--cor-fundo); text-transform: uppercase; letter-spacing: .04em; font-size: var(--tam-micro); color: var(--cor-tinta-2); position: static; }
table.comp td.melhor { background: var(--cor-ok-suave); font-weight: 650; }
table.comp td .prato { display: flex; justify-content: space-between; gap: 8px; }
table.comp td .prato.barato .preco { color: var(--cor-ok); font-weight: 700; }

/* ---------- votos ---------- */
.rank { display: grid; gap: 8px; }
.rank-item { display: grid; grid-template-columns: minmax(28px, auto) minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--cor-superficie); border: var(--borda); border-radius: var(--raio-peq); padding: 10px 12px; }
.rank-pos { font-family: var(--fonte-dados); color: var(--cor-tinta-2); text-align: center; }
.rank-barra { height: 4px; background: var(--cor-superficie-2); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.rank-barra > i { display: block; height: 100%; background: var(--cor-destaque); }
.btn-voto { min-height: 36px; padding: 0 12px; border-radius: var(--raio-pilula); border: var(--borda); background: var(--cor-superficie); font-size: var(--tam-peq); white-space: nowrap; }
.btn-voto[aria-pressed="true"] { background: var(--cor-destaque); border-color: var(--cor-destaque); color: var(--cor-destaque-tinta); font-weight: 600; }

/* ---------- gastos ---------- */
.saldos { display: grid; gap: 6px; }
.saldo-linha { display: grid; grid-template-columns: 96px 1fr 96px; gap: 10px; align-items: center; font-size: var(--tam-peq); }
.saldo-linha .v { text-align: right; font-variant-numeric: tabular-nums; }
.saldo-linha .barra { height: 8px; background: var(--cor-superficie-2); border-radius: 4px; position: relative; }
.saldo-linha .barra i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.saldo-linha .barra i.pos { left: 50%; background: var(--cor-ok); }
.saldo-linha .barra i.neg { right: 50%; background: var(--cor-erro); }
.pos-txt { color: var(--cor-ok); }
.neg-txt { color: var(--cor-erro); }
.transf { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: var(--borda); font-size: var(--tam-peq); }
.transf:last-child { border-bottom: 0; }
.transf.meu { font-weight: 650; }
.gasto { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: var(--borda); }
.gasto:last-child { border-bottom: 0; }
.gasto.estorno { opacity: .6; }
.gasto .valor { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; border: var(--borda); border-radius: var(--raio-pilula); padding: 0 12px; min-height: 40px; font-size: var(--tam-peq); background: var(--cor-superficie); }
.checks label:has(input:checked) { background: var(--cor-destaque-suave); border-color: var(--cor-destaque); }
.checks input { width: 18px; height: 18px; }

/* ---------- folha (modal) e aviso ---------- */
.folha { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.folha-fundo { position: absolute; inset: 0; background: rgba(15, 14, 10, .5); }
.folha-caixa {
  position: relative; background: var(--cor-fundo); width: 100%; max-width: var(--largura-max);
  max-height: 92vh; display: flex; flex-direction: column;
  border-radius: var(--raio) var(--raio) 0 0; box-shadow: var(--sombra-alta);
}
.folha-caixa.larga { max-width: 1100px; height: 92vh; }

  <script>
'use strict';
/* ====================== estado, utilitários, ponte com o servidor ====================== */
const App = {
  dados: null, pessoa: '', aba: 'agenda', busca: '', ultimaCarga: 0, pendentesVoto: 0, desatualizado: false,
  ui: {
    agenda: { quem: null },
    comer: { faixas: [], veg: false, ordem: 'padrao', comparar: [], abertos: [] },
    explorar: { sub: 'Passeios' },
    votos: { aba: 'Restaurantes' }
  }
};
const Acoes = {};
const Vistas = {};
const NAV = [['agenda', 'Agenda'], ['comer', 'Comer'], ['explorar', 'Explorar'], ['votos', 'Votos'], ['gastos', 'Gastos']];
const CHAVE_PESSOA = 'viagem.pessoa';
const CHAVE_ABA = 'viagem.aba';
const CHAVE_CACHE = 'viagem.cache.v1';
const CHAVE_TEMA = 'viagem.tema';
const TEMAS = { auto: 'Tema: auto', claro: 'Tema: claro', escuro: 'Tema: escuro' };

// Sem localStorage (bloqueado ou cheio), guarda em memória enquanto a página estiver aberta.
// A reserva só existe para chave cuja gravação falhou, e então vence o valor velho que ficou no aparelho.
const _memReserva = {};
const Mem = {
  get(k) { if (k in _memReserva) return _memReserva[k]; try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); delete _memReserva[k]; } catch (e) { _memReserva[k] = v; } }
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function norm(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}
function txt(v) { return v == null ? '' : String(v).trim(); }

function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = txt(v).replace(/R\$/gi, '').replace(/\s/g, '');
  if (!s || !/^-?[0-9.,]+$/.test(s)) return null;
  const p = s.indexOf('.') >= 0, c = s.indexOf(',') >= 0;
  if (p && c) s = s.replace(/\./g, '').replace(',', '.');
  else if (c) s = s.replace(',', '.');
  else if (p && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function brl(n) {
  if (n == null) return '';
  const neg = n < 0, c = Math.round(Math.abs(n) * 100);
  const r = Math.floor(c / 100), ce = c % 100;
  return (neg ? '-' : '') + 'R$ ' + String(r).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (ce ? ',' + String(ce).padStart(2, '0') : '');
}
function moeda2(centavos) {
  const neg = centavos < 0, c = Math.abs(centavos);
  return (neg ? '-' : '') + 'R$ ' + String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + String(c % 100).padStart(2, '0');
}
/* número ou texto -> "R$ 60"; se não for número, mostra o texto cru */
function preco(v) { const n = num(v); return n === null ? txt(v) : brl(n); }

function urlOk(s) { s = txt(s); return /^https?:\/\/[^\s<>"']+$/i.test(s) ? s : ''; }
function hostDe(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }
function linkar(t) {
  return esc(t).replace(/https?:\/\/[^\s<>&"']+/g, u => '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + hostDe(u) + '</a>');
}
function linkExterno(url, rotulo) {
  const u = urlOk(url);
  return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(rotulo || hostDe(u)) + '</a>' : '';
}

/* ---------- lugar: ver no mapa, rota a pé, compartilhar ---------- */
// A rota vai sem origin: o Maps parte de onde o celular está, e a rua da base não sai do app.
const CIDADE = 'Salvador, BA';
function consultaLugar(it) {
  return [txt(it.nome), txt(it.endereco) || txt(it.bairro), CIDADE].filter(Boolean).join(', ');
}
function urlMapa(it) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(consultaLugar(it)); }
function urlRotaPe(it) {
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(consultaLugar(it)) + '&travelmode=walking';
}
function urlOnibus(it) {
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(consultaLugar(it)) + '&travelmode=transit';
}
function urlWhats(texto) { return 'https://wa.me/?text=' + encodeURIComponent(texto); }
function chipLink(url, rotulo) {
  return '<a class="chip" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(rotulo) + '</a>';
}
function chipCompartilhar(texto) {
  return '<a class="chip" href="' + esc(urlWhats(texto)) + '" target="_blank" rel="noopener noreferrer" data-acao="compartilhar" data-texto="' + esc(texto) + '">Compartilhar</a>';
}
/* coluna instagram: aceita a URL do perfil ou o @; qualquer outro domínio é recusado (o link vai para o grupo todo) */
function urlInstagram(v) {
  const s = txt(v);
  let m = s.match(/^https?:\/\/(?:www\.)?instagram\.com\/([A-Za-z0-9._]{1,30})\/?(?:\?.*)?$/i);
  if (!m) m = s.match(/^@?([A-Za-z0-9._]{1,30})$/);
  if (!m || /^(p|reel|reels|explore|stories|accounts)$/i.test(m[1])) return '';
  return 'https://www.instagram.com/' + m[1] + '/';
}
/* chips de Instagram, mapa e rota (só com endereço) e de compartilhar; vão dentro de .acoes */
function linksLugar(it) {
  if (!txt(it.nome)) return '';
  const temEnd = !!txt(it.endereco);
  const texto = txt(it.nome) + (temEnd ? ' — ' + txt(it.endereco) : '') + '\n' + urlMapa(it);
  const ig = urlInstagram(it.instagram);
  return (ig ? chipLink(ig, 'Instagram') : '') + (temEnd ? chipLink(urlMapa(it), 'Ver no Maps') + chipLink(urlRotaPe(it), 'Rota a pé') + chipLink(urlOnibus(it), 'De ônibus') : '') + chipCompartilhar(texto);
}
// navigator.share dentro do iframe do Apps Script depende do allow "web-share"; sem ele, vai direto ao wa.me.
function podeShare() {
  if (!navigator.share) return false;
  const fp = document.permissionsPolicy || document.featurePolicy;
  try { return !fp || fp.allowsFeature('web-share'); } catch (e) { return true; }
}
Acoes.compartilhar = async function (el) {
  const texto = el.dataset.texto, wa = el.getAttribute('href');
  if (podeShare()) {
    try { await navigator.share({ text: texto }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  window.open(wa, '_blank', 'noopener');

function hojeISO() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
// Dia que as vistas tratam como "hoje": ?hoje=aaaa-mm-dd na URL, para testar a viagem antes dela.
// Só para mostrar; a data do gasto continua sendo hojeISO().
function hojeVista() {
  const m = /[?&]hoje=(\d{4}-\d{2}-\d{2})(?:&|$)/.exec((window.location && window.location.search) || '');
  return m ? m[1] : hojeISO();
}
/* fechado_em: datas da viagem em que o lugar fecha, "02/11, 03/11" ou "2026-11-02" (o Sheets converte uma data só).
   Só afirma fechado; vazio, "confirmar" ou lixo = sem informação, nunca "aberto". */
function datasFechado(v, ano) {
  return txt(v).split(/[,;]/).map(t => {
    t = t.trim();
    let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
    if (m) return t;
    m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?$/.exec(t);
    return m ? (m[3] || ano) + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') : '';
  }).filter(Boolean);
}
function fechadoEm(it, diaISO) { return datasFechado(it && it.fechado_em, txt(diaISO).slice(0, 4)).indexOf(diaISO) >= 0; }
function idadeCopia() {
  const g = txt(App.dados && App.dados.geradoEm);
  return g ? dataBR(g).slice(0, 5) + ' às ' + g.slice(11, 16) : 'antes';
}
/* Dados mudados no lugar (gasto, estorno, sugestão): a busca refaz o índice. */
function dadosMudaram() { if (typeof _indiceDe !== 'undefined') _indiceDe = null; }
function dataBR(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(txt(iso));
  return m ? m[3] + '/' + m[2] + '/' + m[1] : txt(iso);
}
const DSEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
function rotuloDia(iso) {
  const p = iso.split('-');
  return DSEM[new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay()] + ' ' + p[2] + '/' + p[1];

function duracao(min) {

/* ---------- ponte com o servidor ---------- */
function msgErro(e) {
  let m = (e && e.message) ? e.message : String(e || 'Erro desconhecido');
  return m.replace(/^(Error|Exception):\s*/i, '');
}
// Fora do Google (página hospedada), a ponte é um POST ao /exec; text/plain evita a checagem prévia do CORS.
const URL_API = 'https://script.google.com/macros/s/AKfycbyv_Y3xrlaX_Yl433BPSnkSZ3t7j7-_TYzK_rX1d-q9p2JYVMgxY9LUkwOwcpKYL8my/exec';
const TEMPO_LIMITE_MS = 30000;
// Erro "incerto": o pedido pode ter chegado e gravado, só a resposta se perdeu. Quem grava mantém o id do pedido.
function erroIncerto(grava) {
  const e = new Error(grava ? 'A conexão falhou e pode ter gravado. Tocar de novo é seguro: não duplica.' : 'Sem conexão com o servidor.');
  e.incerto = true;
  return e;
}
async function rpcFetch(nome, args) {
  const grava = nome !== 'apiCarregar';
  const ctl = window.AbortController ? new AbortController() : null;
  const relogio = ctl ? setTimeout(() => ctl.abort(), TEMPO_LIMITE_MS) : 0;
  let r, j;
  try {
    r = await fetch(URL_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: nome, args }), signal: ctl ? ctl.signal : undefined });
    j = await r.json();
  } catch (e) { throw erroIncerto(grava); }
  finally { clearTimeout(relogio); }
  if (j.err) throw new Error(msgErro(j.err));
  return j.res;
}

/* ---------- id do pedido: o mesmo formulário reenviado leva o mesmo id, e o servidor não grava duas vezes ---------- */
const CHAVE_PEDIDOS = 'viagem.pedidos';
const VIDA_PEDIDO_MS = 6 * 3600 * 1000;   // o servidor lembra o id por 6 h
function novoIdPedido() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* segue */ }
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12).padEnd(10, '0');
}
const Pedidos = {
  ler() { try { return JSON.parse(Mem.get(CHAVE_PEDIDOS) || '{}') || {}; } catch (e) { return {}; } },
  gravar(m) { Mem.set(CHAVE_PEDIDOS, JSON.stringify(m)); },
  // Mesmo conteúdo de um envio que ficou incerto reaproveita o id; conteúdo novo ganha id novo.
  idPara(assinatura) {
    const m = this.ler(), agora = Date.now();
    Object.keys(m).forEach(k => { if (!(m[k] && agora - m[k].t < VIDA_PEDIDO_MS)) delete m[k]; });
    if (!m[assinatura]) m[assinatura] = { id: novoIdPedido(), t: agora };
    this.gravar(m);
    return m[assinatura].id;
  },
  esquecer(assinatura) { const m = this.ler(); delete m[assinatura]; this.gravar(m); }
};
// Envia uma escrita com id e só esquece o id no sucesso. Em QUALQUER erro o id fica: o servidor pode ter
// gravado e falhado depois (Sheets lento na releitura). Reaproveitar o id de uma recusa real é inofensivo,
// porque o servidor só marca o id depois que a linha está na planilha; formulário corrigido muda a assinatura.
async function rpcGravar(nome, assinatura, dados) {
  dados.id_pedido = Pedidos.idPara(assinatura);
  const r = await rpc(nome, dados);
  Pedidos.esquecer(assinatura);
  return r;
}
function rpc(nome, ...args) {
  if (!(window.google && google.script && google.script.run)) return rpcFetch(nome, args);
  return new Promise((ok, falha) => {
    try {
      google.script.run.withSuccessHandler(ok).withFailureHandler(e => falha(new Error(msgErro(e))))[nome](...args);
    } catch (e) { falha(new Error(msgErro(e))); }
  });
}

const ROTULOS = {
  faixa_preco: 'faixa', preco_medio_pp: 'preço médio por pessoa', categoria: 'categoria', bairro: 'bairro', endereco: 'endereço',

  seguranca: 'segurança', mar: 'mar', data_evento: 'data', inicio: 'início', tipo: 'tipo', fechado_em: 'fechado na viagem',

// tamanho do texto: tudo na folha de estilo multiplica por --escala
const CHAVE_TEXTO = 'viagem.texto';
const ESCALAS = [0.85, 1, 1.15, 1.3, 1.5];
function aplicarEscala(e) {
  if (ESCALAS.indexOf(e) < 0) e = 1;
  document.documentElement.style.setProperty('--escala', e);
  const menos = document.getElementById('btn-texto-menos'), mais = document.getElementById('btn-texto-mais');
  if (menos) menos.disabled = e === ESCALAS[0];
  if (mais) mais.disabled = e === ESCALAS[ESCALAS.length - 1];
  return e;
}
function mudarEscala(passo) {
  const atual = ESCALAS.indexOf(Number(Mem.get(CHAVE_TEXTO)) || 1);
  const i = Math.max(0, Math.min(ESCALAS.length - 1, (atual < 0 ? 1 : atual) + passo));
  const y = window.scrollY / Math.max(1, document.documentElement.scrollHeight);
  Mem.set(CHAVE_TEXTO, aplicarEscala(ESCALAS[i]));
  window.scrollTo(0, y * document.documentElement.scrollHeight);
  toast('Texto ' + Math.round(ESCALAS[i] * 100) + '%');

async function carregar(forcar, avisar) {
  const btn = document.getElementById('btn-atualizar');
  btn.disabled = true; btn.textContent = 'Atualizando…';
  try {
    const d = await rpc('apiCarregar', !!forcar);
    App.dados = d; App.erro = ''; App.desatualizado = false; App.ultimaCarga = Date.now();
    Mem.set(CHAVE_CACHE, JSON.stringify(d));
    const salvo = Mem.get(CHAVE_PESSOA);
    if (salvo && nomes().some(n => norm(n) === norm(salvo))) definirPessoa(nomes().filter(n => norm(n) === norm(salvo))[0]);
    // Nome sumiu da lista (aba Pessoas em edição): esquece só nesta tela; o guardado volta quando a lista voltar.
    else if (App.pessoa && !nomes().some(souEu)) { App.pessoa = ''; atualizarChipPessoa(); }
    render(true);
    if (avisar) toast('Dados atualizados.');
    if (!App.pessoa && !folhaAberta()) Acoes.escolherPessoa();
  } catch (e) {
    if (App.dados) { App.desatualizado = true; render(true); toast('Não consegui atualizar: ' + e.message, true); }

  } finally {

  }
}

function iniciar() {
  aplicarTema(Mem.get(CHAVE_TEMA));
  aplicarEscala(Number(Mem.get(CHAVE_TEXTO)) || 1);
  if (typeof iniciarBusca === 'function') iniciarBusca();
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-acao]');
    if (!el) return;
    const f = Acoes[el.dataset.acao];
    if (f) { ev.preventDefault(); f(el, ev); }
  });
  document.addEventListener('submit', ev => {
    const f = ev.target.closest('[data-form]');
    if (!f) return;
    ev.preventDefault();
    const fn = Acoes[f.dataset.form];
    if (fn) fn(f, ev);
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && folhaAberta()) Acoes.fecharFolha(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && App.dados && Date.now() - App.ultimaCarga > 60000) carregar(false);
  });

  const abaSalva = Mem.get(CHAVE_ABA);
  if (abaSalva && NAV.some(n => n[0] === abaSalva)) App.aba = abaSalva;
  App.pessoa = Mem.get(CHAVE_PESSOA) || '';
  try { const c = Mem.get(CHAVE_CACHE); if (c) App.dados = JSON.parse(c); } catch (e) { App.dados = null; }
  render();
  carregar(false);
}

  <script>

/* ---------- clima 2–7/11 (Open-Meteo, direto do navegador; falha calada) ---------- */
const CHAVE_CLIMA = 'viagem.clima.v2';   // v2: com UV e pôr do sol; a cópia v1 (sem eles) fica para trás
const URL_CLIMA = 'https://api.open-meteo.com/v1/forecast?latitude=-12.97&longitude=-38.51' +
  '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,uv_index_max,sunset' +
  '&timezone=America/Bahia&start_date=2026-11-02&end_date=2026-11-07';
const CLIMA_VALIDADE_MS = 3 * 3600 * 1000;
function ceuDe(c) {
  if (c === 0) return 'céu limpo';
  if (c === 1 || c === 2) return 'poucas nuvens';
  if (c === 3) return 'nublado';
  if (c === 45 || c === 48) return 'neblina';
  if (c >= 51 && c <= 57) return 'garoa';
  if (c >= 61 && c <= 67) return c >= 65 ? 'chuva forte' : 'chuva';
  if (c >= 80 && c <= 82) return 'pancadas';
  if (c >= 95) return 'trovoada';

}
function climaDeResposta(j) {
  const d = j && j.daily;
  if (!d || !Array.isArray(d.time)) return null;
  return d.time.map((dia, i) => ({
    dia, max: d.temperature_2m_max[i], min: d.temperature_2m_min[i],
    chuva: d.precipitation_probability_max[i], ceu: ceuDe(d.weather_code[i]),

    const dias = climaDeResposta(j);

    '<div class="clima-dia"><span class="clima-rot">' + esc(rotuloDia(d.dia)) + '</span>' +
    '<span class="clima-temp">' + n(d.max) + '° <small>' + n(d.min) + '°</small></span>' +
    '<span class="micro">' + esc(d.ceu) + (d.chuva != null ? ' · chuva ' + n(d.chuva) + '%' : '') + '</span></div>').join('') +
    '</div><p class="micro mudo">Previsão Open-Meteo, atualizada em ' + esc(new Date(App.clima.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })) + '.</p>';
}

/* ---------- pôr na agenda (Google Agenda ou .ics) e compartilhar a sessão ---------- */
// Salvador fica em UTC-3 o ano todo (sem horário de verão): hora local + 3h = UTC.
function utcStamp(dia, min) {
  const p = dia.split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]) + (min + 180) * 60000);
  return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
}
// Evento fora da Socine (ABOCA etc.) não leva UFBA no endereço nem "Socine" no título.
function foraDaSocine(s) { return /fora da socine/i.test(txt(s.sessao)); }
function localSessao(s) { return [s.local, /ufba/i.test(txt(s.local)) || foraDaSocine(s) ? '' : 'UFBA', CIDADE].map(txt).filter(Boolean).join(', '); }
function detalhesSessao(s) {
  return [s.titulo && s.sessao ? s.sessao : '', s.coordenacao ? 'Coordenação: ' + s.coordenacao : '',
    s.pessoa && !s.todos ? 'Apresenta: ' + s.pessoa : '', s.fimEstimado ? 'Término estimado.' : '', foraDaSocine(s) ? 'Programa do grupo na viagem' : 'XXIX Encontro Socine']
    .map(txt).filter(Boolean).join('\n');
}
function tituloAgenda(s) { return (foraDaSocine(s) ? '' : 'Socine: ') + txt(s.titulo || s.sessao); }
function urlGoogleAgenda(s) {
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    '&text=' + encodeURIComponent(tituloAgenda(s)) +
    '&dates=' + utcStamp(s.dia, s.iniMin) + '/' + utcStamp(s.dia, s.fimMin) +
    '&ctz=America/Bahia&location=' + encodeURIComponent(localSessao(s)) +
    '&details=' + encodeURIComponent(detalhesSessao(s));
}
function icsEsc(v) { return txt(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsDe(s) {
  const agora = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const uid = (s.dia + '-' + s.inicio + '-' + norm(s.pessoa) + '-' + norm(s.titulo || s.sessao)).replace(/[^a-z0-9-]/g, '').slice(0, 60);
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Salvador Socine//PT-BR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT', 'UID:' + uid + '@viagem-salvador', 'DTSTAMP:' + agora,
    'DTSTART:' + utcStamp(s.dia, s.iniMin), 'DTEND:' + utcStamp(s.dia, s.fimMin),
    'SUMMARY:' + icsEsc(tituloAgenda(s)), 'LOCATION:' + icsEsc(localSessao(s)), 'DESCRIPTION:' + icsEsc(detalhesSessao(s)),
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(tituloAgenda(s)), 'TRIGGER:-PT30M', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n') + '\r\n';
}
function chaveSessao(s) { return [s.dia, s.inicio, s.pessoa, s.titulo || s.sessao].map(txt).join('|'); }
function sessaoPorChave(k) { return App.dados.socine.sessoes.filter(s => chaveSessao(s) === k)[0] || null; }
Acoes.baixarIcs = function (el) {
  const s = sessaoPorChave(el.dataset.chave);
  if (!s) { toast('Sessão não encontrada; atualize os dados.', true); return; }
  try {
    const url = URL.createObjectURL(new Blob([icsDe(s)], { type: 'text/calendar;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'socine-' + s.dia + '-' + s.inicio.replace(':', 'h') + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) { toast('Não consegui gerar o arquivo: ' + msgErro(e), true); }
};
function textoSessao(s) {
  return tituloAgenda(s) + '\n' + rotuloDia(s.dia) + ', ' + s.inicio + (s.fimEstimado ? '' : '–' + s.fim) +
    (txt(s.local) ? ' · ' + txt(s.local) : '') + (s.pessoa && !s.todos ? '\nApresenta: ' + txt(s.pessoa) : '');
}
function acoesSessao(s) {
  return '<div class="acoes sessao-acoes">' + chipLink(urlGoogleAgenda(s), 'Google Agenda') +
    '<button class="chip" data-acao="baixarIcs" data-chave="' + esc(chaveSessao(s)) + '">Baixar .ics</button>' +
    chipCompartilhar(textoSessao(s)) + '</div>';
}

function horaSessao(s) {
  return esc(s.inicio) + (s.fimEstimado ? '' : '<small>até ' + esc(s.fim) + '</small>');
}
function htmlSessao(s, opt) {
  opt = opt || {};
  const status = txt(s.status), conferido = /^conferido/i.test(status);
  const quem = opt.mostrarQuem && s.pessoa && !s.todos ? esc(s.pessoa) + ' · ' : '';
  const meta = [s.local, s.sessao, s.coordenacao ? 'coord. ' + s.coordenacao : ''].filter(Boolean).map(esc).join(' · ');
  return '<div class="sessao' + (s.todos ? ' todos' : '') + (opt.colega ? ' colega' : '') + '">' +
    '<div class="hora">' + horaSessao(s) + (s.todos ? ' <span class="selo aviso">todos</span>' : '') + '</div>' +
    '<div class="titulo">' + quem + esc(s.titulo || s.sessao) + '</div>' +
    (meta ? '<div class="meta">' + meta + '</div>' : '') +
    (opt.conflito ? '<div class="conflito">no mesmo horário que a sua</div>' : '') +
    (opt.livre ? '<div class="micro" style="color:var(--cor-ok)">horário livre para você assistir</div>' : '') +
    (!conferido && status ? '<div><span class="selo aviso">' + esc(status) + '</span></div>' : '') +
    acoesSessao(s) + '</div>';
}

/* ---------- bloco "Hoje" (só nos dias da viagem) ---------- */
const VIAGEM_DE = '2026-11-02', VIAGEM_ATE = '2026-11-07';
const ABAS_FECHADO = ['Passeios', 'Museus', 'Noite', 'Praias', 'Restaurantes'];
function hojeHtml() {
  const dia = hojeVista(), d = App.dados;
  if (dia < VIAGEM_DE || dia > VIAGEM_ATE) return '';
  const linhas = [];
  if (App.pessoa) {
    const meu = (d.socine.agendas[App.pessoa] || []).filter(x => x.dia === dia)[0];
    const ss = meu ? meu.meus : [];
    linhas.push('<div><strong>Você:</strong> ' + (ss.length
      ? ss.map(s => esc(s.inicio) + ' · ' + esc(s.titulo || s.sessao) + (txt(s.local) ? ' · ' + esc(s.local) : '')).join('; ')
      : 'nenhuma sessão sua hoje.') + '</div>');
  }
  const noite = (d.listas.Noite ? d.listas.Noite.linhas : []).filter(it => txt(it.nome) && datasFechado(it.data_evento, dia.slice(0, 4))[0] === dia)
    .sort((a, b) => (txt(a.inicio) < txt(b.inicio) ? -1 : 1));
  if (noite.length) {
    linhas.push('<div><strong>Hoje à noite:</strong> ' + noite.map(it => (txt(it.inicio) ? esc(it.inicio) + ' ' : '') + esc(it.nome)).join('; ') + '</div>');
  }
  const fechados = [];
  ABAS_FECHADO.forEach(a => { if (d.listas[a]) d.listas[a].linhas.forEach(it => { if (txt(it.nome) && fechadoEm(it, dia)) fechados.push(it.nome); }); });
  if (fechados.length) linhas.push('<div><strong>Fechado hoje:</strong> ' + fechados.map(esc).join(', ') + '</div>');
  const c = App.clima && App.clima.dias.filter(x => x.dia === dia)[0];
  if (c) {
    const n = v => (v == null ? '–' : Math.round(v));
    linhas.push('<div><strong>Tempo:</strong> ' + n(c.max) + '° / ' + n(c.min) + '°' + (c.ceu ? ', ' + esc(c.ceu) : '') +
      (c.chuva != null ? ', chuva ' + n(c.chuva) + '%' : '') + (c.uv != null ? ', UV ' + n(c.uv) : '') +
      (c.por ? ', pôr do sol ' + esc(c.por) : '') + '</div>');
  }
  return '<section class="cartao hoje-bloco" aria-label="Hoje"><h2>Hoje, ' + esc(rotuloDia(dia)) + '</h2>' + linhas.join('') +
    (fechados.length ? '<p class="micro mudo">"Fechado" vem da coluna fechado_em da planilha; lugar sem essa informação não aparece aqui. Confira o horário antes de ir.</p>' : '') +
    '</section>';
}

function diaPessoaHtml(d, quem) {
  const hoje = d.dia === hojeVista();
  const meus = d.meus.map(s => htmlSessao(s)).join('');
  const colegas = d.colegas.length
    ? '<details class="colegas"><summary>Amigos neste dia (' + d.colegas.length + ')</summary>' +
      d.colegas.map(s => htmlSessao(s, { colega: true, mostrarQuem: true, conflito: d.meus.length && s.conflitaComigo, livre: !s.conflitaComigo })).join('') + '</details>'
    : '';
  const brechas = d.brechas.length
    ? '<div class="brechas"><span>Livre:</span>' + d.brechas.map(b =>
        '<span class="brecha">' + b.de + '–' + b.ate + ' (' + duracao(b.minutos) + ')' +
        (b.sugestoes && b.sugestoes.length ? ' → ' + b.sugestoes.map(x => esc(x.nome)).join(', ') : '') + '</span>').join('') + '</div>'
    : '';
  return '<section class="dia' + (hoje ? ' hoje' : '') + '" id="dia-' + d.dia + '">' +
    '<div class="dia-titulo"><h2>' + esc(d.rotulo) + '</h2>' +
    (!d.meus.length && !d.colegas.length ? '<span class="meta">sem apresentações do grupo</span>' : '') + '</div>' +
    (meus || (d.colegas.length ? '<p class="meta">' + (quem === App.pessoa ? 'Você não apresenta' : esc(quem) + ' não apresenta') + ' neste dia.</p>' : '')) +
    colegas + brechas + '</section>';
}

function trunc(s, n) { s = txt(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

function diaGrupoHtml(g) {
  const hoje = g.dia === hojeVista();
  const cab = '<div class="dia-titulo"><h2>' + esc(g.rotulo) + '</h2></div>';
  if (g.vazio) {
    return '<section class="dia' + (hoje ? ' hoje' : '') + '" id="dia-' + g.dia + '">' + cab +
      '<p class="meta">Nenhuma apresentação do grupo: dia livre.</p></section>';
  }
  let tabela = '';
  if (g.colunas.length) {
    const thead = '<tr><th class="rotulo-linha">Quem</th>' + g.colunas.map((c, i) =>
      '<th>' + c + (g.simultaneos[i] > 1 ? '<span class="contagem" title="' + g.simultaneos[i] + ' ao mesmo tempo">' + g.simultaneos[i] + '</span>' : '') + '</th>').join('') + '</tr>';
    const corpo = g.linhas.map(l => '<tr><th class="rotulo-linha">' + esc(l.pessoa) + (souEu(l.pessoa) ? ' <span class="micro mudo">(você)</span>' : '') + '</th>' +
      l.celulas.map(c => c
        ? '<td class="ocupado" title="' + esc(c.titulo) + '"><span class="sala">' + esc(c.local) + '</span><span class="tit">' + esc(trunc(c.titulo, 70)) + '</span></td>'
        : '<td class="livre">·</td>').join('') + '</tr>').join('');
    tabela = '<div class="grade-caixa"><div class="rolagem-x"><table class="grade"><thead>' + thead + '</thead><tbody>' + corpo + '</tbody></table></div></div>';
  }
  const gerais = g.gerais.map(s => htmlSessao(s)).join('');
  return '<section class="dia' + (hoje ? ' hoje' : '') + '" id="dia-' + g.dia + '">' + cab + tabela + gerais + '</section>';
}

Vistas.agenda = function () {
  const d = App.dados, quem = quemAgenda();
  const chips = ['Grupo'].concat(nomes()).map(n =>
    '<button class="chip" data-acao="agendaQuem" data-quem="' + esc(n) + '" aria-pressed="' + (n === quem) + '">' + esc(n) + (souEu(n) ? ' (você)' : '') + '</button>').join('');
  const dias = quem === 'Grupo' ? d.socine.grade : (d.socine.agendas[quem] || []);
  const pilulas = dias.map(x => '<button class="chip" data-acao="irDia" data-dia="' + x.dia + '">' + esc(x.rotulo) + '</button>').join('');
  const corpo = dias.map(x => quem === 'Grupo' ? diaGrupoHtml(x) : diaPessoaHtml(x, quem)).join('');
  const semDados = !d.socine.sessoes.length ? '<div class="vazio">A aba Socine ainda não tem sessões.</div>' : '';
  const ign = d.socine.ignoradas || 0;
  const avisoIgn = ign ? '<p class="peq aviso-linha">' + ign + (ign > 1 ? ' linhas' : ' linha') + ' da aba Socine sem dia ou hora legíveis ficaram fora da agenda (use 2026-11-05 e 19:00).</p>' : '';
  garantirClima();
  return hojeHtml() + climaHtml() + '<div class="fila rolagem" aria-label="Ver agenda de">' + chips + '</div>' +
    '<div class="fila rolagem" aria-label="Ir para o dia">' + pilulas + '</div>' +
    semDados + avisoIgn + corpo +
    '<p class="micro mudo">Fonte: programação do XXIX Encontro Socine; conferência na aba Socine da planilha.</p>';
};
</script>

  <script>
/* ====================== COMER (Restaurantes, Pratos, comparação) ====================== */
const MAX_COMPARAR = 4;
function faixaN(v) { return (txt(v).match(/\$/g) || []).length; }
function restaurantes() { return App.dados.listas.Restaurantes.linhas.filter(r => txt(r.nome)); }
function restPorId(id) { return restaurantes().filter(r => txt(r.id) === txt(id))[0] || null; }

function restFiltrados() {
  const ui = App.ui.comer;
  let L = restaurantes().filter(r =>
    (!ui.faixas.length || ui.faixas.indexOf(faixaN(r.faixa_preco)) >= 0) && (!ui.veg || nivelVeg(r.veg) > 0));
  const chave = { preco: r => num(r.preco_medio_pp), nota: r => { const n = num(r.nota); return n === null ? null : -n; },
    perto: r => { const t = num(r.tempo_pe_min); return t !== null ? t : num(r.distancia_base_km); } }[ui.ordem];
  if (chave) {
    L = L.map((r, i) => ({ r, i, k: chave(r) })).sort((a, b) =>
      (a.k === null) - (b.k === null) || (a.k - b.k) || (a.i - b.i)).map(x => x.r);
  }
  return L;
}

Acoes.faixa = function (el) {
  const n = +el.dataset.n, f = App.ui.comer.faixas, i = f.indexOf(n);
  if (i >= 0) f.splice(i, 1); else f.push(n);
  render(true);
};
Acoes.toggleVeg = function () { App.ui.comer.veg = !App.ui.comer.veg; render(true); };
Acoes.limparFiltros = function () { const u = App.ui.comer; u.faixas = []; u.veg = false; render(true); };
Acoes.ordem = function (el) { App.ui.comer.ordem = el.value; render(true); };
Acoes.togglePratos = function (el) {
  const a = App.ui.comer.abertos, i = a.indexOf(el.dataset.id);
  if (i >= 0) a.splice(i, 1); else a.push(el.dataset.id);
  render(true);
};
Acoes.toggleComparar = function (el) {
  const c = App.ui.comer.comparar, id = el.dataset.id, i = c.indexOf(id);
  if (i >= 0) c.splice(i, 1);
  else if (c.length >= MAX_COMPARAR) { toast('Dá para comparar até ' + MAX_COMPARAR + ' de cada vez.', true); return; }
  else c.push(id);
  render(true);
};
Acoes.limparComparar = function () { App.ui.comer.comparar = []; render(true); };
Acoes.irPara = function (el) {
  const id = el.dataset.id;
  let alvo = document.getElementById('r-' + id);
  if (!alvo) { Acoes.limparFiltros(); alvo = document.getElementById('r-' + id); }
  if (!alvo) { toast('Não achei esse restaurante.', true); return; }
  Acoes.fecharFolha();
  alvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
  alvo.classList.add('destaque'); setTimeout(() => alvo.classList.remove('destaque'), 2200);
};

function pratosHtml(id) {
  const L = (App.dados.pratos.porRestaurante[id] || []).slice().sort((a, b) =>
    (a.tipo < b.tipo ? -1 : a.tipo > b.tipo ? 1 : 0) || ((a.preco == null) - (b.preco == null)) || (a.preco - b.preco));
  if (!L.length) return '<div class="pratos mudo">Sem pratos cadastrados ainda.</div>';
  return '<div class="pratos">' + L.map(p =>
    '<div class="linha"><span>' + esc(p.prato) + (p.tipo ? ' <span class="micro mudo">' + esc(p.tipo) + '</span>' : '') + ' ' + seloVeg(p.veg) +
    '</span><span class="preco">' + esc(p.preco == null ? '' : brl(p.preco)) + '</span></div>').join('') + '</div>';
}

function cartaoRest(r) {
  const id = txt(r.id), ui = App.ui.comer;
  const nPratos = id ? (App.dados.pratos.porRestaurante[id] || []).length : 0;
  const alt = txt(r.alternativa_id) ? restPorId(r.alternativa_id) : null;
  const naComp = ui.comparar.indexOf(id) >= 0;
  const meta = [r.categoria, r.bairro].map(txt).filter(Boolean).map(esc).join(' · ');
  const alternativa = (alt || txt(r.alternativa_porque)) ?
    '<div class="alternativa">Se lotar, vá em ' + (alt ? '<button data-acao="irPara" data-id="' + esc(txt(alt.id)) + '">' + esc(alt.nome) + '</button>' : esc(r.alternativa_id)) +
    (txt(r.alternativa_porque) ? ': ' + esc(r.alternativa_porque) : '') + '.</div>' : '';
  return '<article class="cartao" id="r-' + esc(id) + '">' +
    '<div class="cartao-topo"><div><h3>' + esc(r.nome) + '</h3><div class="meta">' + meta + ' ' + seloVeg(r.veg) + '</div></div>' +
    (txt(r.faixa_preco) ? '<span class="faixa">' + esc(r.faixa_preco) + '</span>' : '') + '</div>' +
    (txt(r.descricao) ? '<p class="peq">' + esc(r.descricao) + '</p>' : '') +
    fatos(r, ['preco_medio_pp', 'tempo_pe_min', 'distancia_base_km', 'uber_pp', 'uber_total', 'onibus', 'horario', 'aceita_grupo_9', 'nota', 'endereco']) +
    alternativa +
    '<div class="acoes">' +
    (id ? botaoVoto('Restaurantes', id) +
      '<button class="chip" data-acao="toggleComparar" data-id="' + esc(id) + '" aria-pressed="' + naComp + '">' + (naComp ? 'Na comparação' : 'Comparar') + '</button>' : '') +
    (id && nPratos ? '<button class="chip" data-acao="togglePratos" data-id="' + esc(id) + '" aria-pressed="' + (ui.abertos.indexOf(id) >= 0) + '">Pratos (' + nPratos + ')</button>' : '') +
    (urlOk(r.link_cardapio) ? '<a class="chip" href="' + esc(urlOk(r.link_cardapio)) + '" target="_blank" rel="noopener noreferrer">Cardápio</a>' : '') +
    linksLugar(r) + '</div>' +
    (id && ui.abertos.indexOf(id) >= 0 ? pratosHtml(id) : '') +
    proveniencia(r) + '</article>';
}

Vistas.comer = function () {
  const ui = App.ui.comer, todos = restaurantes(), L = restFiltrados();
  const filtros = '<div class="fila rolagem">' +
    [1, 2, 3].map(n => '<button class="chip" data-acao="faixa" data-n="' + n + '" aria-pressed="' + (ui.faixas.indexOf(n) >= 0) + '">' + '$'.repeat(n) + '</button>').join('') +
    '<button class="chip" data-acao="toggleVeg" aria-pressed="' + ui.veg + '">Veg</button>' +
    '<select class="chip" style="min-height:40px;width:auto" data-acao-change="ordem" id="sel-ordem" aria-label="Ordenar">' +
    [['padrao', 'Ordem da lista'], ['preco', 'Menor preço'], ['nota', 'Melhor nota'], ['perto', 'Mais perto']].map(o =>
      '<option value="' + o[0] + '"' + (ui.ordem === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>';
  let lista;
  if (!todos.length) {
    lista = '<div class="vazio"><div>Ainda não há restaurantes na planilha.</div><button class="btn primario" data-acao="sugerir" data-aba="Restaurantes">Sugerir um restaurante</button></div>';
  } else if (!L.length) {
    lista = '<div class="vazio"><div>Nenhum restaurante com esses filtros.</div><button class="btn" data-acao="limparFiltros">Limpar filtros</button></div>';
  } else {
    lista = L.map(cartaoRest).join('');
  }
  return '<div class="fila" style="justify-content:space-between"><h2>Onde comer</h2>' +
    (todos.length ? '<button class="btn pequeno" data-acao="sugerir" data-aba="Restaurantes">Sugerir</button>' : '') + '</div>' +
    (todos.length ? filtros + '<p class="micro mudo">' + L.length + ' de ' + todos.length + ' restaurantes</p>' : '') + lista;
};

/* troca de ordem: <select> não dispara click */
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-acao-change]');
  if (el && Acoes[el.dataset.acaoChange]) Acoes[el.dataset.acaoChange](el, ev);
});

/* ---------- barra e tabela de comparação ---------- */
function pintarBarraComparar() {
  const b = document.getElementById('barra-comparar'), c = App.ui.comer.comparar;
  if (App.aba !== 'comer' || !c.length) { b.classList.add('oculto'); return; }
  b.classList.remove('oculto');
  b.innerHTML = '<span class="peq">' + c.length + ' na comparação</span><span class="fila">' +
    '<button class="btn pequeno" data-acao="limparComparar">Limpar</button>' +
    '<button class="btn pequeno primario" data-acao="abrirComparacao"' + (c.length < 2 ? ' disabled' : '') + '>Ver lado a lado</button></span>';
}

const LINHAS_COMP = [
  ['Faixa', 'faixa_preco', ''], ['Preço médio por pessoa', 'preco_medio_pp', 'min'], ['Categoria', 'categoria', ''], ['Bairro', 'bairro', ''],
  ['A pé', 'tempo_pe_min', 'min'], ['Distância', 'distancia_base_km', 'min'], ['Uber por pessoa', 'uber_pp', 'min'], ['Uber total', 'uber_total', 'min'],
  ['Ônibus', 'onibus', ''], ['Horário', 'horario', ''], ['Grupo de 9', 'aceita_grupo_9', ''], ['Veg', 'veg', ''], ['Nota', 'nota', 'max']
];

function melhorIdx(vals, modo) {
  const nums = vals.map(num);
  const ok = nums.filter(n => n !== null);
  if (!modo || ok.length < 2) return -1;
  const alvo = modo === 'min' ? Math.min.apply(null, ok) : Math.max.apply(null, ok);
  if (ok.every(n => n === alvo)) return -1;
  return nums.indexOf(alvo);
}

function tabelaComparacao(ids) {
  const rs = ids.map(restPorId).filter(Boolean);
  if (rs.length < 2) return '<div class="vazio">Escolha pelo menos dois restaurantes.</div>';
  let h = '<table class="comp"><thead><tr><th class="rotulo-linha"></th>' + rs.map(r => '<th>' + esc(r.nome) + '</th>').join('') + '</tr></thead><tbody>';
  LINHAS_COMP.forEach(([rot, chave, modo]) => {
    const vals = rs.map(r => r[chave]);
    if (vals.every(v => txt(v) === '')) return;
    const m = melhorIdx(vals, modo);
    h += '<tr><th class="rotulo-linha">' + esc(rot) + '</th>' + vals.map((v, i) =>
      '<td' + (i === m ? ' class="melhor"' : '') + '>' + (chave === 'veg' ? (seloVeg(v) || '<span class="mudo">não</span>') : esc(valorDe(chave, v))) + '</td>').join('') + '</tr>';
  });
  h += '<tr><th class="rotulo-linha">Interesse do grupo</th>' + rs.map(r => '<td>' + votosDe('Restaurantes', txt(r.id)).total + ' voto(s)</td>').join('') + '</tr>';
  h += '<tr><th class="rotulo-linha">Se lotar</th>' + rs.map(r => {
    const a = restPorId(r.alternativa_id);
    return '<td>' + (a ? esc(a.nome) + (txt(r.alternativa_porque) ? '<div class="micro mudo">' + esc(r.alternativa_porque) + '</div>' : '') : '<span class="mudo">—</span>') + '</td>';
  }).join('') + '</tr>';
  h += '<tr><th class="rotulo-linha">Cardápio</th>' + rs.map(r => '<td>' + (linkExterno(r.link_cardapio, 'abrir') || '<span class="mudo">—</span>') + '</td>').join('') + '</tr>';

  const grupos = App.dados.pratos.porTipo.filter(g => rs.some(r => g.porRestaurante[txt(r.id)]));
  h += '<tr class="secao"><th colspan="' + (rs.length + 1) + '">Prato a prato</th></tr>';
  if (!grupos.length) {
    h += '<tr><td colspan="' + (rs.length + 1) + '" class="mudo">Ainda não há pratos cadastrados para estes restaurantes.</td></tr>';
  }
  grupos.forEach(g => {
    const precos = [];
    rs.forEach(r => (g.porRestaurante[txt(r.id)] || []).forEach(p => { if (p.preco != null) precos.push(p.preco); }));
    const min = Math.min.apply(null, precos), max = Math.max.apply(null, precos);
    h += '<tr><th class="rotulo-linha">' + esc(g.rotulo) + '</th>' + rs.map(r => {
      const ps = g.porRestaurante[txt(r.id)] || [];
      return '<td>' + (ps.length ? ps.map(p =>
        '<div class="prato' + (precos.length > 1 && min < max && p.preco === min ? ' barato' : '') + '"><span>' + esc(p.prato) + ' ' + seloVeg(p.veg) +
        '</span><span class="preco">' + esc(p.preco == null ? '' : brl(p.preco)) + '</span></div>').join('') : '<span class="mudo">—</span>') + '</td>';
    }).join('') + '</tr>';
  });
  h += '</tbody></table>';
  return '<div class="rolagem-x grade-caixa">' + h + '</div>' +
    '<p class="micro mudo">Verde: o melhor valor da linha (menor preço ou distância, maior nota). Preços e pratos vêm da planilha; confira a fonte e a data no card de cada restaurante.</p>';
}
Acoes.abrirComparacao = function () {
  abrirFolha('Comparar restaurantes', tabelaComparacao(App.ui.comer.comparar), true);
};
</script>

  <script>

const FILTROS = {

};
Acoes.filtroSub = function (el) { App.ui.explorar['f_' + App.ui.explorar.sub] = el.dataset.f; render(); };

Vistas.explorar = function () {
  const sub = App.ui.explorar.sub;
  const chips = '<div class="fila rolagem">' + SUBS.map(s =>
    '<button class="chip" data-acao="sub" data-sub="' + s + '" aria-pressed="' + (s === sub) + '">' + (s === 'Info' ? 'Info prática' : s) + '</button>').join('') + '</div>';
  if (sub === 'Info') return chips + infoHtml();
  const aba = App.dados.listas[sub];
  let L = itensDe(sub);
  if (sub === 'Noite') L = L.slice().sort((a, b) => (txt(a.data_evento) + txt(a.inicio)) < (txt(b.data_evento) + txt(b.inicio)) ? -1 : 1);
  let filtro = '';
  if (FILTROS[sub]) {
    const atual = App.ui.explorar['f_' + sub] || 'tudo', f = FILTROS[sub].filter(x => x[0] === atual)[0] || FILTROS[sub][0];
    const contados = FILTROS[sub].map(x => [x, L.filter(x[2]).length]);
    if (contados.every(c => c[1] > 0)) {

  const corpo = L.length ? L.map(it => cartaoGenerico(sub, it, aba.cabecalhos)).join('')

Acoes.sugerir = function (el) {
  if (!exigirPessoa()) return;
  const aba = el.dataset.aba, cfg = App.dados.config;

  const cabs = App.dados.listas[aba].cabecalhos || [];

Acoes.enviarSugestao = async function (form) {
  const aba = form.dataset.aba, fd = new FormData(form), campos = {};
  fd.forEach((v, k) => { if (k !== 'senha') campos[k] = v; });
  if (fd.get('senha') != null) _senha = String(fd.get('senha'));
  const botao = form.querySelector('button[type=submit]'), erro = document.getElementById('erro-sugestao');
  botao.disabled = true; botao.textContent = 'Enviando…'; erro.classList.add('oculto');
  try {
    const assinatura = 'sug|' + JSON.stringify([App.pessoa, aba, campos]);

    erro.textContent = e.message; erro.classList.remove('oculto');
    botao.disabled = false; botao.textContent = 'Enviar sugestão';
  }
};

  <script>
/* ====================== GASTOS ====================== */
const NOMES_CAT = { comida: 'comida', transporte: 'transporte', hospedagem: 'hospedagem', passeio: 'passeio', ingresso: 'ingresso', outros: 'outros' };

function dividirTexto(lista) {
  const part = lista.split(',').map(txt).filter(Boolean);
  if (part.length && part.length >= nomes().length) return 'todos';
  return part.length <= 4 ? part.join(', ') : part.length + ' pessoas';
}

/* Mesmo pagador, mesmo valor, mesma data, nenhum estornado: provável lançamento em dois celulares.
   Só marca; duas parcelas iguais de verdade continuam valendo. */
function chaveRepetido(g) { return g.ehEstorno || g.estornado || g.categoria === 'acerto' || g.valor == null ? '' : [norm(g.pagou), Math.round(g.valor * 100), txt(g.data)].join('|'); }
function repetidos(lista) {
  const n = {};
  lista.forEach(g => { const k = chaveRepetido(g); if (k) n[k] = (n[k] || 0) + 1; });
  return n;
}
function linhaGasto(g, i, rep) {
  const podeEstornar = !g.ehEstorno && !g.estornado;
  const dup = rep && chaveRepetido(g) && rep[chaveRepetido(g)] > 1;
  return '<div id="g-' + i + '" class="gasto' + (g.ehEstorno || g.estornado ? ' estorno' : '') + '">' +
    '<div><strong>' + esc(g.descricao) + '</strong>' + (g.estornado ? ' <span class="selo erro">estornado</span>' : '') + (dup ? ' <span class="selo aviso">repetido?</span>' : '') +
    '<div class="meta">' + esc(dataBR(g.data)) + (g.categoria === 'acerto'
      ? ' · ' + esc(g.pagou) + ' pagou a ' + esc(g.dividir_entre) + ' · acerto'
      : ' · pagou ' + esc(g.pagou) + ' · para ' + esc(dividirTexto(g.dividir_entre)) + (g.categoria ? ' · ' + esc(g.categoria) : '')) + '</div></div>' +
    '<div class="valor">' + (g.valor == null ? '' : moeda2(Math.round(g.valor * 100))) + '</div>' +
    (podeEstornar ? '<div style="grid-column:1/-1"><button class="btn pequeno perigo" data-acao="estornar" data-reg="' + esc(g.registrado_em) + '">Estornar</button></div>' : '') + '</div>';
}

Vistas.gastos = function () {
  const g = App.dados.gastos;
  const saldos = g.saldos.slice().sort((a, b) => b.centavos - a.centavos);
  const maxAbs = Math.max(1, ...saldos.map(s => Math.abs(s.centavos)));
  const linhasSaldo = saldos.map(s => {
    const w = Math.round(50 * Math.abs(s.centavos) / maxAbs);
    return '<div class="saldo-linha"><span>' + esc(s.pessoa) + (souEu(s.pessoa) ? ' <span class="micro mudo">(você)</span>' : '') + '</span>' +
      '<span class="barra">' + (s.centavos ? '<i class="' + (s.centavos > 0 ? 'pos' : 'neg') + '" style="width:' + w + '%"></i>' : '') + '</span>' +
      '<span class="v ' + (s.centavos > 0 ? 'pos-txt' : s.centavos < 0 ? 'neg-txt' : 'mudo') + '">' + moeda2(s.centavos) + '</span></div>';
  }).join('');
  // Só quem paga vê o "Paguei": se os dois lados apertassem, entrariam duas linhas e o saldo inverteria.
  const transf = g.transferencias.length
    ? g.transferencias.map(t => '<div class="transf' + (souEu(t.de) || souEu(t.para) ? ' meu' : '') + '"><span>' + esc(t.de) + ' paga a ' + esc(t.para) + '</span><span class="preco">' + moeda2(t.centavos) + '</span>' +
        (souEu(t.de) ? '<div style="flex-basis:100%"><button class="btn pequeno" data-acao="paguei" data-de="' + esc(t.de) + '" data-para="' + esc(t.para) + '" data-c="' + t.centavos + '">Paguei</button></div>' : '') + '</div>').join('') +
      '<div class="acoes">' + chipCompartilhar(textoAcerto(g.transferencias)) + '</div>'
    : '<p class="peq mudo">' + (g.lista.length ? 'Tudo quitado.' : 'Ainda sem lançamentos.') + '</p>';
  const eu = g.saldos.filter(s => souEu(s.pessoa))[0];
  const resumoEu = eu ? '<p class="peq">' + (eu.centavos > 0 ? 'Você tem <strong class="pos-txt">' + moeda2(eu.centavos) + '</strong> a receber.'
    : eu.centavos < 0 ? 'Você deve <strong class="neg-txt">' + moeda2(-eu.centavos) + '</strong>.' : 'Você está quite.') + '</p>' : '';
  const rep = repetidos(g.lista);
  const nRep = Object.keys(rep).filter(k => rep[k] > 1).length;
  const lanc = g.lista.length ? g.lista.map((x, i) => linhaGasto(x, i, rep)).join('') : '<p class="peq mudo">Nenhum gasto lançado ainda.</p>';
  const avisos = (nRep ? '<p class="peq aviso-linha">Há lançamento marcado "repetido?": mesmo pagador, valor e dia. Se for o mesmo gasto lançado duas vezes, estorne um.</p>' : '') +
    (g.ignorados ? '<p class="peq aviso-linha">' + g.ignorados + (g.ignorados > 1 ? ' linhas' : ' linha') + ' da aba Gastos com valor ou pagador ilegível ficaram fora da conta.</p>' : '');
  return '<div class="fila" style="justify-content:space-between"><h2>Gastos</h2><span class="peq mudo">total lançado ' + moeda2(g.totalCentavos) + '</span></div>' +
    '<button class="btn primario" style="width:100%" data-acao="novoGasto">Lançar gasto</button>' + avisos +
    '<section class="cartao"><h3>Saldo de cada um</h3>' + resumoEu + '<div class="saldos">' + linhasSaldo + '</div>' +
    '<p class="micro mudo">Verde: tem a receber. Vermelho: deve ao grupo.</p></section>' +
    '<section class="cartao"><h3>Quem paga a quem</h3><div>' + transf + '</div></section>' +
    '<section class="cartao"><h3>Lançamentos</h3><div>' + lanc + '</div></section>';
};

function textoAcerto(transf) {
  return 'Acerto da viagem (Salvador – Socine):\n' + transf.map(t => t.de + ' paga a ' + t.para + ' ' + moeda2(t.centavos)).join('\n') +
    '\nQuem pagou toca em "Paguei" na aba Gastos.';
}
function reais(c) { return (c / 100).toFixed(2).replace('.', ','); }

Acoes.paguei = function (el) {
  if (!exigirPessoa()) return;
  const de = el.dataset.de, para = el.dataset.para, c = Number(el.dataset.c);
  if (!souEu(de)) return;

  <script>
/* ====================== BUSCA (tudo do app numa barra só) ====================== */
// Sem acento e sem maiúscula; todas as palavras digitadas precisam aparecer (em qualquer campo do item).
const MAX_RESULTADOS = 80;
const CAMPOS_FORA = ['id', 'fonte', 'acesso_em', 'verificado', 'link', 'link_cardapio', 'alternativa_id', 'lat', 'lng', 'instagram'];
// Palavras que o amigo digita e a planilha escreve de outro jeito.
const APELIDOS = [
  [/barco|lancha|escuna|catamar|saveiro|ferry|travessia/, 'barco passeio de barco'],
  [/praia/, 'praia mar'],
  [/museu/, 'museu exposicao'],

function textoDe(it, chaves) {
  return chaves.filter(k => CAMPOS_FORA.indexOf(k) < 0).map(k => txt(it[k])).filter(Boolean).join(' · ');
}

/* cada entrada: { grupo, titulo, sub, alvo, nomeN, tudoN, campos: [[rotulo, texto]] } */
function indiceBusca() {

    E.push({ grupo: 'Restaurantes', titulo: r.nome, sub: [r.categoria, r.bairro, r.faixa_preco].map(txt).filter(Boolean).join(' · '),
      alvo: { tipo: 'rest', id: txt(r.id), nome: txt(r.nome) }, campos,
      extra: 'restaurante comer comida almoco jantar ' + veg(r.veg) + ' ' + pratos.map(veg).join(' ') });
  });

      E.push({ grupo: aba, titulo: it.nome, sub: [it.tipo, it.bairro, quando].map(txt).filter(Boolean).join(' · '),
        alvo: { tipo: 'item', aba, id: txt(it.id), nome: txt(it.nome) },

      alvo: { tipo: 'info', i }, campos: [['', txt(r.texto)]], extra: 'info pratica dica' });
  });
  d.socine.sessoes.forEach(s => {
    E.push({ grupo: 'Socine', titulo: txt(s.titulo) || txt(s.sessao),
      sub: [s.todos ? 'todos' : s.pessoa, rotuloDiaCurto(s.dia), s.inicio, s.local].map(txt).filter(Boolean).join(' · '),
      alvo: { tipo: 'sessao', dia: txt(s.dia), pessoa: s.todos ? 'Grupo' : txt(s.pessoa), titulo: txt(s.titulo) || txt(s.sessao) },
      campos: [['sessão', txt(s.sessao)], ['coordenação', txt(s.coordenacao)], ['', txt(s.pessoa)], ['', txt(s.local)]],
      extra: 'socine agenda apresentacao sessao ' + rotuloDiaCurto(s.dia) });

    E.push({ grupo: 'Gastos', titulo: txt(g.descricao), sub: [dataBR(g.data), 'pagou ' + txt(g.pagou), g.valor == null ? '' : moeda2(Math.round(g.valor * 100))].filter(Boolean).join(' · '),
      alvo: { tipo: 'gasto', i }, campos: [['', txt(g.categoria)], ['para', txt(g.dividir_entre)]], extra: 'gasto despesa conta' });
  });
  E.forEach(e => {
    e.nomeN = norm(e.titulo);

  });

}
function rotuloDiaCurto(dia) { try { return typeof rotuloDia === 'function' ? rotuloDia(dia) : dia; } catch (e) { return dia; } }

/* o índice só se refaz quando os dados mudam */
let _indice = null, _indiceDe = null;
function indice() { if (_indiceDe !== App.dados) { _indice = indiceBusca(); _indiceDe = App.dados; } return _indice; }

function buscar(q, E) {
  const termos = norm(q).split(/\s+/).filter(Boolean);
  if (!termos.length) return [];
  const R = [];
  E.forEach((e, ordem) => {
    if (!termos.every(t => e.tudoN.indexOf(t) >= 0)) return;
    // começo de palavra vale mais que pedaço no meio dela ("uber" acha a dica de Uber antes do Cine Glauber)
    let p = 0;
    termos.forEach(t => {
      const inicio = new RegExp('(^|[^a-z0-9])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      if (e.nomeN.indexOf(t) === 0) p += 30;
      else if (inicio.test(e.nomeN)) p += 20;
      else if (inicio.test(norm(e.sub))) p += 8;
      else if (inicio.test(e.tudoN)) p += 6;
      else if (e.nomeN.indexOf(t) >= 0) p += 3;
      else p += 1;
    });
    R.push({ e, p, ordem });
  });
  return R.sort((a, b) => b.p - a.p || a.ordem - b.ordem).map(x => x.e);
}

/* trecho do campo que casou, com o termo marcado */
function trechoCasado(e, termos) {
  for (const [rot, t] of e.campos) {
    const n = norm(t);
    // só o termo que não está à vista no título nem na linha de baixo (senão o trecho repete o que já se lê)
    const termo = termos.filter(x => n.indexOf(x) >= 0 && e.nomeN.indexOf(x) < 0 && norm(e.sub).indexOf(x) < 0)[0];
    if (!termo) continue;
    const i = n.indexOf(termo), ini = Math.max(0, i - 40), fim = Math.min(t.length, i + termo.length + 60);
    // norm() preserva o comprimento (NFD tira só as marcas combinantes), então o índice vale no texto original
    const pedaco = (ini ? '…' : '') + esc(t.slice(ini, i)) + '<mark>' + esc(t.slice(i, i + termo.length)) + '</mark>' + esc(t.slice(i + termo.length, fim)) + (fim < t.length ? '…' : '');
    return '<div class="micro mudo">' + (rot ? esc(rot) + ': ' : '') + pedaco + '</div>';
  }
  return '';
}
function marcar(titulo, termos) {
  const n = norm(titulo); let html = '', pos = 0;
  const faixas = [];
  termos.forEach(t => { let i = n.indexOf(t); while (i >= 0 && t) { faixas.push([i, i + t.length]); i = n.indexOf(t, i + t.length); } });
  faixas.sort((a, b) => a[0] - b[0]).forEach(([a, b]) => { if (a < pos) return; html += esc(titulo.slice(pos, a)) + '<mark>' + esc(titulo.slice(a, b)) + '</mark>'; pos = b; });
  return html + esc(titulo.slice(pos));
}
